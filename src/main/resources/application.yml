spring:
  application:
    name: java-web-app
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/webapp_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.webapp: DEBUG
